name: Windows packaging comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    name: ${{ matrix.variant }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        variant: [upstream-original, pnpm-invocation-only, desktop-fixed]
    steps:
      - uses: actions/checkout@v4
        with:
          path: desktop
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: basketikun/infinite-canvas
          ref: d916904c13664d4492c85a2c28f3b4f137187d16
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: upstream/package.json
      - name: Prepare and compare
        env:
          VARIANT: ${{ matrix.variant }}
        shell: pwsh
        run: ./desktop/.github/desktop/compare-windows.ps1 -Variant $env:VARIANT
